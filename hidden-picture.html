<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>숨은그림찾기</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --green: #BFF366;
    --green-dark: #8BCC2A;
    --green-deep: #3D6B00;
    --green-mid: #A8E84A;
    --cream: #FAFFF0;
    --brown: #4A3728;
    --brown-light: #8B6F5E;
    --radius-xl: 24px;
    --radius-lg: 18px;
    --radius-md: 14px;
    --shadow-sm: 0 2px 12px rgba(61,107,0,0.12);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.2);
    --hud-h: 56px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
html, body { height:100%; overflow:hidden; overscroll-behavior:none; font-family:'Noto Sans KR',sans-serif; position:relative; }
body { background: linear-gradient(180deg, #C8FF6E 0%, #F3FFD9 100%); }

.hud-top {
    position:absolute; top:0; left:0; right:0; z-index:5; height:var(--hud-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:max(8px, env(safe-area-inset-top)) 10px 8px;
    background:var(--cream);
    box-shadow:0 2px 10px rgba(61,107,0,0.15);
}
.hud-left { display:flex; align-items:center; gap:6px; }
.home-btn {
    width:34px; height:34px; border-radius:50%; background:white;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    text-decoration:none; box-shadow:var(--shadow-sm); flex-shrink:0;
}
.home-btn:active { transform:scale(0.92); }
.title-badge { background:var(--green-deep); color:var(--green); font-family:'Gaegu',cursive; font-size:14px; font-weight:700; padding:5px 10px; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); white-space:nowrap; }

.find-list {
    display:flex; gap:4px; background:white; border-radius:var(--radius-lg);
    padding:5px 8px; box-shadow:var(--shadow-sm);
}
.find-item {
    width:24px; height:24px; border-radius:50%; background:#F0F4E0;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    opacity:0.4; filter:grayscale(1); transition:all 0.3s;
}
.find-item.found { opacity:1; filter:none; background:var(--green); transform:scale(1.1); }

.viewport {
    position:absolute; top:var(--hud-h); left:0; right:0; bottom:0; z-index:1;
    overflow:hidden; touch-action:none; background:#16301f;
}
.stage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.stage img { display:block; width:100%; height:100%; pointer-events:none; }
.found-ring {
    position:absolute; border:3px solid #fff; border-radius:50%;
    box-shadow:0 0 0 3px var(--green-dark), 0 0 14px rgba(0,0,0,0.35);
    transform:translate(-50%,-50%) scale(0); pointer-events:none;
    animation:ringPop 0.4s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes ringPop { to { transform:translate(-50%,-50%) scale(1); } }

.rotate-prompt { display:none; position:fixed; inset:0; z-index:2000; background:var(--cream); flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; }
.rotate-icon { font-size:48px; animation:rotateHint 1.6s ease-in-out infinite; }
@keyframes rotateHint { 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-90deg);} }
.rotate-prompt p { font-family:'Gaegu',cursive; font-size:20px; color:var(--green-deep); font-weight:700; }
@media (orientation:portrait) { .rotate-prompt{display:flex;} }

.zoom-hint {
    position:absolute; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:4; background:rgba(0,0,0,0.55); color:white; font-size:12px; font-weight:500;
    padding:7px 14px; border-radius:999px; pointer-events:none; transition:opacity 0.6s; white-space:nowrap;
}

.overlay { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity 0.35s; }
.overlay.show { opacity:1; pointer-events:all; }
.overlay-card { background:white; border-radius:var(--radius-xl); padding:26px 24px; width:100%; max-width:320px; text-align:center; box-shadow:var(--shadow-lg); position:relative; overflow:hidden; transform:scale(0.8) translateY(30px); transition:transform 0.45s cubic-bezier(.34,1.56,.64,1); }
.overlay.show .overlay-card { transform:scale(1) translateY(0); }
.overlay-card::before { content:''; position:absolute; top:0; left:0; right:0; height:8px; background:linear-gradient(90deg, var(--green), var(--green-mid), var(--green)); }
.overlay-emoji { font-size:40px; margin-bottom:8px; }
.overlay-title { font-family:'Gaegu',cursive; font-size:24px; font-weight:700; color:var(--green-deep); margin-bottom:8px; }
.overlay-sub { font-size:13px; color:var(--brown-light); line-height:1.6; margin-bottom:14px; }
.target-list { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:18px; }
.target-chip { background:#F0F4E0; color:var(--green-deep); font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; }
.overlay-btn { width:100%; padding:13px; border:none; border-radius:var(--radius-md); background:var(--green-deep); color:var(--green); font-size:15px; font-weight:700; font-family:'Noto Sans KR',sans-serif; cursor:pointer; }
.overlay-btn:active { transform:scale(0.97); }
.home-link { display:block; margin-top:10px; font-size:12px; font-weight:700; color:var(--brown-light); text-decoration:none; padding:6px; }
.home-link:active { opacity:0.6; }

.found-toast {
    position:fixed; z-index:6; pointer-events:none;
    font-family:'Gaegu',cursive; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.6);
    font-size:18px; opacity:0; transition:none; transform:translateX(-50%);
}
</style>
</head>
<body>

<div class="hud-top">
  <div class="hud-left">
    <a href="/" class="home-btn" title="메인으로">🏠</a>
    <div class="title-badge">🔍 숨은그림찾기</div>
  </div>
  <div class="find-list" id="find-list"></div>
</div>

<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <img id="scene" src="/assets/hidden/scene.webp" alt="해변 그림" draggable="false">
  </div>
</div>
<div class="zoom-hint" id="zoom-hint">두 손가락으로 확대 · 드래그로 이동</div>

<div class="rotate-prompt">
  <div class="rotate-icon">🔄</div>
  <p>화면을 가로로 돌려주세요</p>
</div>

<div class="overlay show" id="title-overlay">
  <div class="overlay-card">
    <div class="overlay-emoji">🔍</div>
    <div class="overlay-title">숨은그림찾기</div>
    <p class="overlay-sub">해변 그림 속에 숨어있는 6가지를 찾아보세요!<br>그림을 드래그하고 확대해서 찾으면 톡 눌러주세요.</p>
    <div class="target-list" id="target-list"></div>
    <button class="overlay-btn" id="start-btn">시작하기</button>
    <a class="home-link" href="/">🏠 메인으로</a>
  </div>
</div>

<div class="overlay" id="result-overlay">
  <div class="overlay-card">
    <div class="overlay-emoji">🎉</div>
    <div class="overlay-title">다 찾았어요!</div>
    <p class="overlay-sub" id="result-sub"></p>
    <button class="overlay-btn" id="result-btn">다시 하기</button>
    <a class="home-link" id="home-link" href="/">🏠 메인으로</a>
  </div>
</div>

<script src="/progress.js"></script>
<script>

const IMG_SIZE = 1254;
const HIDDEN_OBJECTS = [
  { id: 'ladybug', emoji: '🐞', label: '무당벌레', x: 305,  y: 48,  r: 70 },
  { id: 'heart',   emoji: '💗', label: '하트 구름', x: 1142, y: 175, r: 75 },
  { id: 'bottle',  emoji: '🍾', label: '유리병',   x: 358,  y: 485, r: 75 },
  { id: 'fish',    emoji: '🐟', label: '물고기',   x: 953,  y: 468, r: 80 },
  { id: 'pencil',  emoji: '✏️', label: '연필',     x: 225,  y: 752, r: 75 },
  { id: 'key',     emoji: '🔑', label: '열쇠',     x: 1105, y: 745, r: 70 }
];

let minZoom = 1;
let maxZoom = 6;

const viewport = document.getElementById('viewport');
const stage = document.getElementById('stage');
const findListEl = document.getElementById('find-list');
const hintEl = document.getElementById('zoom-hint');

let found = new Set();
let startTime = null;
let gameActive = false;

let S = 300, z = 1, tx = 0, ty = 0;

function clampPan() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const s = S * z;
  tx = s <= vw ? (vw - s) / 2 : Math.min(0, Math.max(vw - s, tx));
  ty = s <= vh ? (vh - s) / 2 : Math.min(0, Math.max(vh - s, ty));
}
function applyTransform() {
  clampPan();
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
}
let lastLandscape = null;
function layout() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  if (!vw || !vh) return;
  S = Math.min(vw, vh);
  minZoom = 1;
  maxZoom = 6;
  stage.style.width = S + 'px';
  stage.style.height = S + 'px';
  const landscape = vw >= vh;
  if (lastLandscape !== landscape) { z = minZoom; tx = 0; ty = 0; lastLandscape = landscape; }
  z = Math.min(maxZoom, Math.max(minZoom, z));
  applyTransform();
}
function resetView() {
  z = minZoom; tx = 0; ty = 0;
  layout();
}
function zoomAt(cx, cy, factor) {
  const nz = Math.min(maxZoom, Math.max(minZoom, z * factor));
  const k = nz / z;
  tx = cx - (cx - tx) * k;
  ty = cy - (cy - ty) * k;
  z = nz;
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

function renderFindList() {
  findListEl.innerHTML = '';
  for (const o of HIDDEN_OBJECTS) {
    const div = document.createElement('div');
    div.className = 'find-item' + (found.has(o.id) ? ' found' : '');
    div.textContent = o.emoji;
    div.title = o.label;
    findListEl.appendChild(div);
  }
}
(function renderTargetChips() {
  const el = document.getElementById('target-list');
  el.innerHTML = HIDDEN_OBJECTS.map(o => `<span class="target-chip">${o.emoji} ${o.label}</span>`).join('');
})();

function addRing(o) {
  const ring = document.createElement('div');
  ring.className = 'found-ring';
  ring.dataset.ring = o.id;
  const pct = (v) => (v / IMG_SIZE * 100) + '%';
  ring.style.left = pct(o.x);
  ring.style.top = pct(o.y);
  ring.style.width = pct(o.r * 2);
  ring.style.height = pct(o.r * 2);
  stage.appendChild(ring);
}
function spawnFoundFeedback(x, y, label) {
  const toast = document.createElement('div');
  toast.className = 'found-toast';
  toast.textContent = '✅ ' + label + '!';
  toast.style.left = x + 'px';
  toast.style.top = y + 'px';
  document.body.appendChild(toast);
  requestAnimationFrame(() => {
    toast.style.transition = 'transform 0.8s ease-out, opacity 0.8s ease-out';
    toast.style.transform = 'translateX(-50%) translateY(-30px)';
    toast.style.opacity = '1';
  });
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 800);
}

function handleTap(clientX, clientY) {
  if (!gameActive) return;
  const rect = stage.getBoundingClientRect();
  const ix = (clientX - rect.left) / rect.width * IMG_SIZE;
  const iy = (clientY - rect.top) / rect.height * IMG_SIZE;
  for (const o of HIDDEN_OBJECTS) {
    if (found.has(o.id)) continue;
    if (Math.hypot(o.x - ix, o.y - iy) <= o.r) {
      found.add(o.id);
      addRing(o);
      renderFindList();
      spawnFoundFeedback(clientX, clientY, o.label);
      if (found.size >= HIDDEN_OBJECTS.length) setTimeout(endGame, 700);
      return;
    }
  }
}

const pointers = new Map();
let moved = false, pinched = false, startX = 0, startY = 0;

viewport.addEventListener('pointerdown', (e) => {
  try { viewport.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { moved = false; pinched = false; startX = e.clientX; startY = e.clientY; }
  else pinched = true;
});
viewport.addEventListener('pointermove', (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };
  const vr = viewport.getBoundingClientRect();
  if (pointers.size === 1) {
    if (!moved && Math.hypot(cur.x - startX, cur.y - startY) > 8) moved = true;
    if (moved) { tx += cur.x - prev.x; ty += cur.y - prev.y; applyTransform(); }
    pointers.set(e.pointerId, cur);
  } else if (pointers.size === 2) {
    const before = [...pointers.values()];
    const oc = { x: (before[0].x + before[1].x) / 2, y: (before[0].y + before[1].y) / 2 };
    const od = Math.hypot(before[0].x - before[1].x, before[0].y - before[1].y);
    pointers.set(e.pointerId, cur);
    const after = [...pointers.values()];
    const nc = { x: (after[0].x + after[1].x) / 2, y: (after[0].y + after[1].y) / 2 };
    const nd = Math.hypot(after[0].x - after[1].x, after[0].y - after[1].y);
    if (od > 0) zoomAt(oc.x - vr.left, oc.y - vr.top, nd / od);
    tx += nc.x - oc.x; ty += nc.y - oc.y;
    applyTransform();
  }
});
function endPointer(e) {
  const wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (e.type === 'pointerup' && wasSingle && !moved && !pinched) handleTap(e.clientX, e.clientY);
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const vr = viewport.getBoundingClientRect();
  zoomAt(e.clientX - vr.left, e.clientY - vr.top, e.deltaY < 0 ? 1.2 : 1 / 1.2);
  applyTransform();
}, { passive: false });

function startGame() {
  found = new Set();
  stage.querySelectorAll('.found-ring').forEach(r => r.remove());
  renderFindList();
  resetView();
  startTime = performance.now();
  gameActive = true;
  hintEl.style.opacity = '1';
  setTimeout(() => { hintEl.style.opacity = '0'; }, 4000);
  document.getElementById('title-overlay').classList.remove('show');
  document.getElementById('result-overlay').classList.remove('show');
}

function endGame() {
  gameActive = false;
  const elapsedSec = Math.round((performance.now() - startTime) / 1000);
  document.getElementById('result-sub').textContent = `${elapsedSec}초 만에 전부 찾았어요!`;

  if (typeof SiteProgress !== 'undefined') {
    SiteProgress.recordRun('hiddenPicture', { completed: true, lastTimeMs: elapsedSec * 1000 });
  }

  document.getElementById('home-link').href = '/?piece=4';

  document.getElementById('result-overlay').classList.add('show');
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('result-btn').addEventListener('click', startGame);

document.getElementById('scene').addEventListener('error', () => {
  viewport.insertAdjacentHTML('beforeend',
    '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:24px">그림을 불러오지 못했어요.<br>새로고침 해주세요.</div>');
});

renderFindList();
layout();
hintEl.style.opacity = '0';
</script>
</body>
</html>
